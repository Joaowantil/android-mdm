# nginx do painel: serve o React e repassa /api para a API. Escuta em 8080 (imagem sem root);
# o docker-compose.yml publica essa porta como 80 e 8000 no servidor.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Só arquivos estáticos são comprimidos. As respostas da API (JSON com dados e tokens) NÃO
    # são, de propósito: comprimir respostas que misturam segredos com dados que o cliente
    # influencia é a base do ataque BREACH.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # DNS interno do Docker. Com a API numa variável, o nginx resolve o nome a cada 10 s:
    # se o container da API for recriado (IP novo), o painel continua funcionando sem
    # reiniciar o nginx. Sem isso ele guardaria o IP antigo e daria 502 até ser reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8000;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCREVE (não acrescenta) o cabeçalho: o que o cliente mandou é descartado e a API
        # só enxerga o IP real. Acrescentar permitiria forjar o IP no log de auditoria e
        # driblar o limite de tentativas de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # A API já envia estes três; o nginx os define para o site todo. Descartar os da API
        # evita o mesmo cabeçalho duas vezes (X-Frame-Options duplicado é inválido).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Saúde da API, para monitoramento externo e para o healthcheck do container "web".
    location = /health {
        proxy_pass $api_upstream;
        access_log off;
    }

    # Arquivos com hash no nome (gerados pelo build): cache longo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # O index.html nunca fica em cache: é ele que aponta para os arquivos novos depois de uma atualização.
    location = /index.html {
        expires -1;
    }

    # Qualquer outra rota é do painel (React Router).
    location / {
        try_files $uri /index.html;
    }
}
